name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  coverage:
    name: PHPUnit + Browser Tests with Coverage
    runs-on: ubuntu-latest

    services:
      html-validator:
        image: ghcr.io/validator/validator
        ports:
          - 8888:8888

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build frontend assets (Istanbul-instrumented for browser-JS coverage)
        run: npm run build
        env:
          COVERAGE: 'true'

      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database/data && touch database/data/database.sqlite
          php artisan migrate --force

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Run PHPUnit tests with coverage
        run: |
          APP_ENV=testing php artisan config:clear
          ./vendor/bin/pest tests/Feature tests/Unit --coverage-clover=coverage-phpunit.xml
        env:
          APP_ENV: testing

      - name: Run Browser tests with coverage
        run: |
          ./vendor/bin/pest tests/Browser --parallel --coverage-clover=coverage-browser.xml
        env:
          APP_ENV: testing
          COVERAGE: 'true'
          HTML_VALIDATOR_URL: http://localhost:8888

      - name: Merge browser-JS coverage snapshots
        run: node scripts/merge-browser-coverage.mjs

      # One upload per flag — a combined upload would stamp every flag onto
      # every file, which breaks the per-flag/component breakdown on Codecov.
      - name: Upload PHP coverage (phpunit)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-phpunit.xml
          flags: phpunit
          fail_ci_if_error: false

      - name: Upload PHP coverage (browser)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-browser.xml
          flags: browser
          fail_ci_if_error: false

      - name: Upload JS coverage (vitest)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: vitest
          fail_ci_if_error: false

      - name: Upload JS coverage (browser-js)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-browser-js/lcov.info
          flags: browser-js
          fail_ci_if_error: false
